# Stdio server config for Smithery. This file is not a registry submission.
# ARCH_API_KEY is optional: arch_review needs it; kjv_lookup does not.
# Leaving configSchema with no required array keeps every property optional.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      ARCH_API_KEY:
        type: string
        title: Arch API Key
        description: >-
          Optional. Secret Arch API key for paid arch_review. Get one at
          https://arch.tnvolman.com/#access. The server sends it as the
          X-API-Key header on POST /v1/review. Leave blank to use only the
          free offline kjv_lookup.
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["server/index.mjs"],
      env: {
        ...(config.ARCH_API_KEY ? { ARCH_API_KEY: config.ARCH_API_KEY } : {})
      }
    })
  exampleConfig:
    ARCH_API_KEY: your-arch-api-key
